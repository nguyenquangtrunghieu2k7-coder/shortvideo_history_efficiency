services:
  recommender:
    build:
      context: ../..
      dockerfile: deploy/global/Dockerfile
    env_file:
      - ${GLOBAL_ENV_FILE:?Set GLOBAL_ENV_FILE}
    volumes:
      - ${GLOBAL_RUNTIME_DIR:?Set GLOBAL_RUNTIME_DIR}:/runtime:ro
    command: ["--checkpoint","/runtime/ranker.pt","--root","/runtime/snapshots","--table","/runtime/calibration.json","--policy-file","/runtime/policy/business.json","--bind","0.0.0.0","--port","8778"]
    ports:
      - "127.0.0.1:8778:8778"
    cpus: 2
    mem_limit: 6g
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
